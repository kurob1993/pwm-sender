services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - 'auth:/app/.wwebjs_auth'
      - 'cache:/app/.wwebjs_cache'
      - 'node_modules:/app/node_modules'
    environment:
      - NODE_ENV=development
      - API_URL=${APP_URL} # Tambahkan variabel lingkungan di sini
volumes:
  auth:
    driver: local
  cache:
    driver: local
  node_modules:
    driver: local